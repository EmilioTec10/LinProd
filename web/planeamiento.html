<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración de Línea de Producción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen planning-screen" data-node-id="9:144" data-name="Optimizar mockup de producción">
      <section class="planning-body" data-node-id="9:145" data-name="Body">
        <div class="planning-container" data-node-id="9:146" data-name="Container">
          <header class="top-card" data-node-id="9:147" data-name="Container">
            <div class="top-card-row" data-node-id="9:148" data-name="Container">
              <img
                class="top-logo"
                data-node-id="9:149"
                data-name="Image (Production)"
                src="http://localhost:3845/assets/ed13cc7a5d838747801a5b4220d99361f22c3775.png"
                alt="Producción"
              />
              <div class="top-heading-wrap" data-node-id="9:150" data-name="Container">
                <h1 class="top-title" data-node-id="9:151" data-name="Heading 1">
                  Configuración de Línea de Producción
                </h1>
                <p class="top-meta" data-node-id="9:153" data-name="Paragraph">
                  0 procesos configurados • 0 ciclos totales
                </p>
              </div>
            </div>
          </header>

          <section class="cards-grid" data-node-id="9:155" data-name="Container">
            <article class="panel panel-left" data-node-id="9:156" data-name="Container">
              <div class="panel-header" data-node-id="9:157" data-name="Container">
                <h2 class="panel-title" data-node-id="9:158" data-name="Heading 2">Procesos</h2>
                <button class="add-process-btn" type="button" data-node-id="9:160" data-name="Button">
                  <img
                    class="add-process-icon"
                    data-node-id="9:161"
                    data-name="Icon"
                    src="http://localhost:3845/assets/14facc576a05ff58abb4b7a5e45bbb08d52475bb.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span class="add-process-label" data-node-id="9:164">Agregar Proceso</span>
                </button>
              </div>

              <div class="empty-state-left" data-node-id="9:165" data-name="Container">
                <p class="empty-state-title" data-node-id="9:166" data-name="Paragraph">
                  No hay procesos configurados
                </p>
                <p class="empty-state-text" data-node-id="9:168" data-name="Paragraph">
                  Haz clic en "Agregar Proceso" para comenzar
                </p>
              </div>
            </article>

            <article class="panel panel-right" data-node-id="9:170" data-name="Container">
              <div class="empty-state-right" data-node-id="9:171" data-name="Container">
                <img
                  class="empty-state-icon"
                  data-node-id="9:173"
                  data-name="Icon"
                  src="http://localhost:3845/assets/a9bf4fb62bbe1f997e23120b3b2270a830a39f26.svg"
                  alt=""
                  aria-hidden="true"
                />
                <p class="empty-state-title right" data-node-id="9:176" data-name="Paragraph">
                  Selecciona "Agregar Proceso"
                </p>
                <p class="empty-state-text right" data-node-id="9:178" data-name="Paragraph">
                  para comenzar a configurar tareas
                </p>
              </div>
            </article>
          </section>
        </div>
      </section>
    </main>
    <script src="planeamiento.js"></script>
  </body>
</html>

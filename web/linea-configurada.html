<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Línea Configurada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen configured-screen" data-node-id="9:752" data-name="Optimizar mockup de producción">
      <section class="configured-body" data-node-id="9:753" data-name="Body">
        <div class="configured-container" data-node-id="9:754" data-name="Container">
          <header class="top-card configured-top" data-node-id="9:755" data-name="Container">
            <div class="configured-top-row" data-node-id="9:756" data-name="Container">
              <div class="configured-title-group" data-node-id="9:757" data-name="Container">
                <img
                  class="top-logo"
                  data-node-id="9:758"
                  data-name="Image (Production)"
                  src="http://localhost:3845/assets/ed13cc7a5d838747801a5b4220d99361f22c3775.png"
                  alt="Producción"
                />
                <div class="top-heading-wrap" data-node-id="9:759" data-name="Container">
                  <h1 class="top-title" data-node-id="9:760" data-name="Heading 1">
                    Configuración de Línea de Producción
                  </h1>
                  <p class="top-meta" data-node-id="9:762" data-name="Paragraph">
                    1 proceso configurado • 2 ciclos totales
                  </p>
                </div>
              </div>

              <div class="production-controls" data-node-id="9:764" data-name="Container">
                <label class="field-label" for="cantidad" data-node-id="9:766" data-name="Label">
                  Cantidad a producir
                </label>
                <div class="controls-row">
                  <input
                    id="cantidad"
                    class="cantidad-input"
                    type="number"
                    min="1"
                    value="1"
                    data-node-id="9:768"
                    data-name="Number Input"
                  />
                  <button class="start-btn" type="button" data-node-id="9:770" data-name="Button">
                    <img
                      class="add-process-icon"
                      data-node-id="9:771"
                      data-name="Icon"
                      src="http://localhost:3845/assets/753bf3f37ed06d88e6d6bf31f73dc78b0fccd58f.svg"
                      alt=""
                      aria-hidden="true"
                    />
                    <span data-node-id="9:774">Iniciar Producción</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          <section class="cards-grid configured-grid" data-node-id="9:775" data-name="Container">
            <article class="panel configured-processes" data-node-id="9:776" data-name="Container">
              <div class="panel-header" data-node-id="9:777" data-name="Container">
                <h2 class="panel-title" data-node-id="9:778" data-name="Heading 2">Procesos</h2>
                <button class="add-process-btn" type="button" data-node-id="9:780" data-name="Button">
                  <img
                    class="add-process-icon"
                    data-node-id="9:781"
                    data-name="Icon"
                    src="http://localhost:3845/assets/14facc576a05ff58abb4b7a5e45bbb08d52475bb.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span class="add-process-label" data-node-id="9:784">Agregar Proceso</span>
                </button>
              </div>

              <div class="process-card" data-node-id="9:786" data-name="Container">
                <div class="process-card-head" data-node-id="9:787" data-name="Container">
                  <div class="process-card-info" data-node-id="9:789" data-name="Container">
                    <span class="process-index" data-node-id="9:790" data-name="Container">1</span>
                    <div class="process-copy" data-node-id="9:792" data-name="Container">
                      <h3 data-node-id="9:793" data-name="Heading 3">s</h3>
                      <p data-node-id="9:795" data-name="Paragraph">1 tarea</p>
                    </div>
                  </div>
                  <div class="process-actions" data-node-id="9:797" data-name="Container">
                    <button class="icon-btn light" type="button" title="Editar" data-node-id="9:798" data-name="Button">
                      <img src="http://localhost:3845/assets/ee903375c9c70f60af71f7b628a80477d40e3253.svg" alt="" aria-hidden="true" />
                    </button>
                    <button class="icon-btn light" type="button" title="Eliminar" data-node-id="9:802" data-name="Button">
                      <img src="http://localhost:3845/assets/f94c5c8370fe7c4fd29d0e805fe30e4db1d7d0aa.svg" alt="" aria-hidden="true" />
                    </button>
                  </div>
                </div>

                <div class="process-tasks" data-node-id="9:809" data-name="Container">
                  <div class="process-task-row" data-node-id="9:810" data-name="Container">
                    <div class="process-task-left" data-node-id="9:811" data-name="Container">
                      <span class="task-order" data-node-id="9:812" data-name="Text">1.</span>
                      <span class="task-name-main" data-node-id="9:814" data-name="Text">q</span>
                    </div>
                    <span class="task-duration" data-node-id="9:816" data-name="Text">2 min</span>
                  </div>
                </div>
              </div>
            </article>

            <article class="panel panel-right" data-node-id="9:818" data-name="Container">
              <div class="empty-state-right" data-node-id="9:819" data-name="Container">
                <img
                  class="empty-state-icon"
                  data-node-id="9:821"
                  data-name="Icon"
                  src="http://localhost:3845/assets/a9bf4fb62bbe1f997e23120b3b2270a830a39f26.svg"
                  alt=""
                  aria-hidden="true"
                />
                <p class="empty-state-title right" data-node-id="9:824" data-name="Paragraph">
                  Selecciona "Agregar Proceso"
                </p>
                <p class="empty-state-text right" data-node-id="9:826" data-name="Paragraph">
                  para comenzar a configurar tareas
                </p>
              </div>
            </article>
          </section>
        </div>
      </section>
    </main>
    <script src="linea-configurada.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo Proceso - Con Tarea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen process-screen" data-node-id="9:634" data-name="Optimizar mockup de producción">
      <section class="planning-body" data-node-id="9:635" data-name="Body">
        <div class="planning-container process-container" data-node-id="9:636" data-name="Container">
          <header class="top-card" data-node-id="9:638" data-name="Container">
            <div class="top-card-row" data-node-id="9:639" data-name="Container">
              <img
                class="top-logo"
                data-node-id="9:640"
                data-name="Image (Production)"
                src="http://localhost:3845/assets/ed13cc7a5d838747801a5b4220d99361f22c3775.png"
                alt="Producción"
              />
              <div class="top-heading-wrap" data-node-id="9:641" data-name="Container">
                <h1 class="top-title" data-node-id="9:642" data-name="Heading 1">
                  Configuración de Línea de Producción
                </h1>
                <p class="top-meta" data-node-id="9:644" data-name="Paragraph">
                  1 proceso configurado • 0 ciclos totales
                </p>
              </div>
            </div>
          </header>

          <section class="cards-grid process-grid" data-node-id="9:646" data-name="Container">
            <article class="panel panel-left process-list process-list-short" data-node-id="9:647" data-name="Container">
              <div class="panel-header" data-node-id="9:648" data-name="Container">
                <h2 class="panel-title" data-node-id="9:649" data-name="Heading 2">Procesos</h2>
                <button class="add-process-btn add-process-btn-disabled" type="button" disabled data-node-id="9:651" data-name="Button">
                  <img
                    class="add-process-icon"
                    data-node-id="9:652"
                    data-name="Icon"
                    src="http://localhost:3845/assets/14facc576a05ff58abb4b7a5e45bbb08d52475bb.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span class="add-process-label" data-node-id="9:655">Agregar Proceso</span>
                </button>
              </div>
            </article>

            <article class="panel process-form-panel process-form-panel-short" data-node-id="9:656" data-name="Container">
              <div class="process-form-head" data-node-id="9:657" data-name="Container">
                <h2 class="panel-title" data-node-id="9:658" data-name="Heading 2">Nuevo Proceso</h2>
                <p class="top-meta" data-node-id="9:660" data-name="Paragraph">
                  Configura el nombre, posición y tareas
                </p>
              </div>

              <section class="form-block" data-node-id="9:662" data-name="Container">
                <h3 class="block-title" data-node-id="9:663" data-name="Heading 3">Configuración del Proceso</h3>

                <div class="field" data-node-id="9:666" data-name="Container">
                  <label class="field-label" for="nombre-proceso-filled" data-node-id="9:667" data-name="Label">
                    Nombre del proceso
                  </label>
                  <input
                    id="nombre-proceso-filled"
                    class="text-input"
                    type="text"
                    value="s"
                    data-node-id="9:669"
                    data-name="Text Input"
                    readonly
                  />
                </div>

                <div class="field" data-node-id="9:671" data-name="Container">
                  <span class="field-label" data-node-id="9:672" data-name="Label">Posición en la línea</span>

                  <label class="radio-option" data-node-id="9:675" data-name="Label">
                    <input type="radio" name="posicion-filled" value="primero" />
                    <span class="radio-dot" data-node-id="9:676" data-name="Radio Button"></span>
                    <span class="radio-copy" data-node-id="9:677" data-name="Container">
                      <strong>Primero</strong>
                      <small>Agregar al inicio de la línea</small>
                    </span>
                  </label>

                  <label class="radio-option" data-node-id="9:682" data-name="Label">
                    <input type="radio" name="posicion-filled" value="ultimo" />
                    <span class="radio-dot" data-node-id="9:683" data-name="Radio Button"></span>
                    <span class="radio-copy" data-node-id="9:684" data-name="Container">
                      <strong>Último</strong>
                      <small>Agregar al final de la línea</small>
                    </span>
                  </label>

                  <label class="radio-option selected" data-node-id="9:689" data-name="Label">
                    <input type="radio" name="posicion-filled" value="cola" checked />
                    <span class="radio-dot" data-node-id="9:690" data-name="Radio Button"></span>
                    <span class="radio-copy" data-node-id="9:691" data-name="Container">
                      <strong>Añadir a la cola</strong>
                      <small>Agregar en orden secuencial</small>
                    </span>
                  </label>
                </div>
              </section>

              <section class="form-block" data-node-id="9:696" data-name="Container">
                <h3 class="block-title" data-node-id="9:697" data-name="Heading 3">Nueva Tarea</h3>

                <div class="field" data-node-id="9:700" data-name="Container">
                  <label class="field-label" for="nombre-tarea-filled" data-node-id="9:701" data-name="Label">
                    Nombre de la tarea
                  </label>
                  <input
                    id="nombre-tarea-filled"
                    class="text-input"
                    type="text"
                    value="q"
                    data-node-id="9:703"
                    data-name="Text Input"
                    readonly
                  />
                </div>

                <div class="field" data-node-id="9:705" data-name="Container">
                  <label class="field-label" for="ciclos-filled" data-node-id="9:706" data-name="Label">Ciclos</label>
                  <input
                    id="ciclos-filled"
                    class="text-input"
                    type="number"
                    value="2"
                    data-node-id="9:708"
                    data-name="Number Input"
                    readonly
                  />
                </div>

                <button class="add-task-btn disabled" type="button" disabled data-node-id="9:710" data-name="Button">
                  <img
                    class="add-process-icon"
                    data-node-id="9:711"
                    data-name="Icon"
                    src="http://localhost:3845/assets/14facc576a05ff58abb4b7a5e45bbb08d52475bb.svg"
                    alt=""
                    aria-hidden="true"
                  />
                  <span data-node-id="9:714">Agregar Tarea</span>
                </button>
              </section>

              <section class="task-list" data-node-id="9:715" data-name="Container">
                <h3 class="block-title" data-node-id="9:716" data-name="Heading 3">Tareas del proceso (1)</h3>
                <div class="task-item" data-node-id="9:718" data-name="Container">
                  <div class="task-main" data-node-id="9:719" data-name="Container">
                    <img
                      class="task-bullet"
                      data-node-id="9:720"
                      data-name="Icon"
                      src="http://localhost:3845/assets/aa3ed7234209489249de877fc0067121de0fc432.svg"
                      alt=""
                      aria-hidden="true"
                    />
                    <div class="task-copy" data-node-id="9:727" data-name="Container">
                      <div class="task-line-1" data-node-id="9:728" data-name="Container">
                        <span class="task-index" data-node-id="9:729" data-name="Text">#1</span>
                        <span class="task-name" data-node-id="9:731" data-name="Text">q</span>
                      </div>
                      <p class="task-time" data-node-id="9:733">2 minutos</p>
                    </div>
                  </div>
                  <div class="task-actions" data-node-id="9:734" data-name="Container">
                    <button class="icon-btn" type="button" title="Editar" data-node-id="9:735" data-name="Button">
                      <img src="http://localhost:3845/assets/f83e9a3013472836b3350dda3ab4c642044592c7.svg" alt="" aria-hidden="true" />
                    </button>
                    <button class="icon-btn" type="button" title="Eliminar" data-node-id="9:739" data-name="Button">
                      <img src="http://localhost:3845/assets/cec49ce05c29905ff079bf96d02131f0222cfdc3.svg" alt="" aria-hidden="true" />
                    </button>
                  </div>
                </div>
              </section>

              <div class="actions" data-node-id="9:746" data-name="Container">
                <button class="btn-ghost" type="button" data-node-id="9:747" data-name="Button">Cancelar</button>
                <button class="btn-solid" type="button" data-node-id="9:749" data-name="Button">Guardar Proceso</button>
              </div>
            </article>
          </section>
        </div>
      </section>
    </main>
    <script src="proceso-con-tarea.js"></script>
  </body>
</html>
